services:
  postgres:
    image: postgres:16
    container_name: hear-me-out-postgres
    environment:
      POSTGRES_DB: hear_me_out
      POSTGRES_USER: hear_me_out_user
      POSTGRES_PASSWORD: hear_me_out_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hear_me_out_user -d hear_me_out"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: hear_me_out
      PGUSER: hear_me_out_user
      PGPASSWORD: hear_me_out_password
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
